        html.redirecting,
        html.redirecting body {
            margin: 0;

            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: sans-serif;
        }

        .spinner {
            border: 6px solid #444;
            border-top: 6px solid #09f;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        // Only redirect if on the old GitHub Pages domain
        if (window.location.hostname === "sreecharan-desu.github.io") {
            document.documentElement.classList.add("redirecting");
            document.addEventListener("DOMContentLoaded", () => {
                document.body.innerHTML = `
                    <div class="spinner"></div>
                    <div>Redirecting to gradelite.sreecharandesu.in...</div>
                `;
                setTimeout(() => {
                    window.location.replace("https://gradelite.sreecharandesu.in");
                }, 500);
            });
        }
    </script>
